[workspace]
resolver = "2"
members = ["crates/classfile", "crates/jvm", "crates/decompiler", "crates/cli"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/ejfkdev/jcdc"
homepage = "https://github.com/ejfkdev/jcdc"

[workspace.dependencies]
jcdc-classfile = { path = "crates/classfile", version = "0.1.3" }
jcdc-jvm = { path = "crates/jvm", version = "0.1.3" }
jcdc-decompiler = { path = "crates/decompiler", version = "0.1.3" }
# Sibling path dep (the release job clones the tag this pin names). 0.2:
# Arc<str> IR payloads, FxHash maps, borrowed group/dom APIs.
jdc-core = { path = "../jdc-core", version = "0.2.17" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
debug = true
