[package]
name = "jcdc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "jcdc — Java class file decompiler (Java 1.1-26 bytecode to recompilable source)"

[[bin]]
name = "jcdc"
path = "src/main.rs"

[dependencies]
# Allocation is ~1/3 of the profile on whole-jar runs; the system allocator
# throttles under 18 render workers. mimalloc keeps per-thread arenas.
mimalloc = { version = "0.1", default-features = false }
jcdc-classfile = { workspace = true }
jcdc-jvm = { workspace = true }
jcdc-decompiler = { workspace = true }
anyhow = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
