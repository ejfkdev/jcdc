name: Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Release artifacts ship without debug symbols (the workspace profile
  # keeps debug=true for local profiling).
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  # The binary's --version prints CARGO_PKG_VERSION, so the git tag and
  # the workspace version must be the same string.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal workspace version
        run: |
          V=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=${GITHUB_REF_NAME} cargo=v$V"
          [ "v$V" = "${GITHUB_REF_NAME}" ] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo workspace version v$V"
            exit 1
          }

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 + arm64 (native ARM runner) — UPX
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
            upx: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            upx: true
          # Windows x64 + arm64 (cross on the x64 runner; UPX best-effort —
          # ARM64 PE support depends on the runner's UPX build)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
            upx: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            upx: true
          # macOS arm64 (Apple silicon) + amd64 (cross on the arm runner);
          # UPX does not support Mach-O — shipped stripped, uncompressed
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            upx: false
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-amd64
            upx: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin jcdc

      - name: UPX-compress (linux/windows; best-effort)
        if: matrix.upx
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/jcdc
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update -y && sudo apt-get install -y upx ;;
            Windows) choco install upx -y --no-progress ;;
          esac
          BEFORE=$(stat -c %s "$BIN" 2>/dev/null || wc -c < "$BIN")
          { upx --best --lzma "$BIN" || upx --best "$BIN"; } && upx -t "$BIN" \
            || echo "::warning::UPX unsupported for this binary — shipping uncompressed"
          AFTER=$(stat -c %s "$BIN" 2>/dev/null || wc -c < "$BIN")
          echo "upx: $BEFORE -> $AFTER bytes"

      # Assets are the RAW binaries (no tar/zip), named per platform, plus
      # one combined SHA256SUMS.txt assembled in the release job.
      - name: Stage binary asset
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/jcdc
          OUT=dist/jcdc-${GITHUB_REF_NAME}-${{ matrix.name }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BIN.exe" "$OUT.exe"
          else
            cp "$BIN" "$OUT"
            chmod +x "$OUT"
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: jcdc-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jcdc-*
          path: assets
          merge-multiple: true
      - name: Combined checksums
        run: (cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # Per-tag release notes live in .github/release-notes/<tag>.md (written
      # together with the version bump); a tag without one falls back to the
      # generated commit list alone.
      - name: Compose release body
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cat "$NOTES" > release-body.md
          else
            : > release-body.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: release-body.md
          generate_release_notes: true
