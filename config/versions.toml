# jcdc 版本兼容性配置
#
# 每个 [[version]] 条目对应一个 class 文件主版本号（major = Java 版本 + 44，
# JDK 1.1-1.4 为 45-48）。未列出的版本使用内置默认值（见
# crates/jvm/src/features.rs::builtin_features），新 JDK 发布时可以在此追加
# 条目而无需修改代码。条目中的字段会整体覆盖该版本的内置特性集，
# 未写字段取 serde 默认值（见 VersionFeatures::default）。
#
# 字段说明：
#   class_major                  class 文件主版本号
#   java_version                 对应 Java SE 版本（展示用）
#   jsr_ret                      允许 jsr/ret 字节码（<= JDK 6，即 major <= 50）
#   stack_map_table              存在/要求 StackMapTable（major >= 50）
#   invokedynamic                允许 invokedynamic（major >= 51）
#   interface_default_methods    接口默认/静态方法（major >= 52）
#   module_info                  module-info 类（major >= 53）
#   private_interface_methods    接口私有方法（major >= 53）
#   nest_based_access            NestHost/NestMembers 属性（major >= 55）
#   dynamic_constant             CONSTANT_Dynamic（major >= 55）
#   records                      record 类（major >= 60）
#   sealed_classes               sealed/PermittedSubclasses（major >= 60）
#   string_concat_indy           javac 用 StringConcatFactory indy 拼接字符串（源码级 >= 9）
#   lambda_indy                  javac 用 LambdaMetafactory indy 生成 lambda（源码级 >= 8）

# ---- 旧版本（1.x 系列）----
[[version]]
class_major = 45
java_version = "1.1"
jsr_ret = true
stack_map_table = false
invokedynamic = false
interface_default_methods = false
module_info = false
private_interface_methods = false
nest_based_access = false
dynamic_constant = false
records = false
sealed_classes = false
string_concat_indy = false
lambda_indy = false

